<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALORANT League Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo"><span class="sq"></span>VAL<span class="tag">·</span>MANAGER</div>
    <div class="spacer"></div>
    <div class="myteam" id="teamBadge" style="display:none">
      <span class="lbl">MY CLUB</span>
      <span class="dot" id="badgeDot"></span>
      <b id="badgeName">—</b>
    </div>
  </div>
</header>

<!-- ============ SELECT ============ -->
<section class="screen on" id="scSelect">
  <div class="wrap">
    <div class="eyebrow">2026 Season · Career Mode</div>
    <h1 class="big">Take the <em>chair</em>.</h1>
    <p class="sub">Pick a club from one of the four international leagues. You run the roster and the game plan — the server decides the rest, round by round. Foundation build: static ratings, live match sim, full regular season.</p>
    <div id="selectRoot"></div>
  </div>
</section>

<!-- ============ HUB ============ -->
<section class="screen" id="scHub">
  <div class="wrap">
    <div id="hubRoot"></div>
  </div>
</section>

<!-- ============ SQUAD ============ -->
<section class="screen" id="scSquad">
  <div class="wrap">
    <div id="squadRoot"></div>
  </div>
</section>

<!-- ============ PLAYER DETAIL ============ -->
<section class="screen" id="scPlayer">
  <div class="wrap">
    <div id="playerRoot"></div>
  </div>
</section>

<!-- ============ MAP VETO ============ -->
<section class="screen" id="scVeto">
  <div class="wrap">
    <div id="vetoRoot"></div>
  </div>
</section>

<!-- ============ DRAFT (player picks stance) ============ -->
<section class="screen" id="scDraft">
  <div class="wrap">
    <div id="draftRoot"></div>
  </div>
</section>

<!-- ============ MATCH ============ -->
<section class="screen" id="scMatch">
  <div class="wrap">
    <div id="matchHeadRoot"></div>

    <div id="mapViewRoot"></div>

    <div id="matchFeedRoot"></div>

    <div id="boxRoot"></div>

    <div id="matchBtnsRoot"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
